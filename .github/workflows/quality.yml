name: API quality
run-name: "API quality ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || 'manual' }} at ${{ github.sha }}"

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/debtflow_ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/debtflow_ci
      JWT_SECRET: ci-placeholder-only-not-used-to-authenticate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run ai:setup
      - run: npm run check
      - run: npm run test:deployment
      - run: npm run docs:check
      - run: npm run docs:build
