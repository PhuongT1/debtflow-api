name: Deploy production
run-name: Deploy production at ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: 'Apply all pending database migrations and verify status before deploying (changes the database)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  release:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      apply_migrations: ${{ inputs.apply_migrations }}
    secrets: inherit
